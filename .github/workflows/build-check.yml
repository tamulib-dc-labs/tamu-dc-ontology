name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/build_site.py
      - name: Fail if generated files are out of date
        run: |
          git diff --exit-code -- tamu-dc-types.ttl tamu-dc-types.rdf index.html || \
            (echo "::error::Generated files are stale. Run 'python3 scripts/build_site.py' and commit the result." && exit 1)
